<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusDESK - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="purple-orb orb-1"></div>
    <div class="purple-orb orb-2"></div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
                <span class="brand-text">CampusDESK</span>
            </div>

            <a href="tickets.html?action=new" class="btn-new-ticket">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nuevo Ticket
            </a>

            <div class="nav-section">
                <div class="nav-label">General</div>
                <ul class="nav-menu">
                    <li>
                        <a href="dashboard.html" class="nav-item active">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="tickets.html" class="nav-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            Tickets
                        </a>
                    </li>
                </ul>
            </div>

            <div class="nav-section admin-only hidden" id="admin-menu">
                <div class="nav-label">Administración</div>
                <ul class="nav-menu">
                    <li>
                        <a href="admin.html" class="nav-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            Gestión de Personal
                        </a>
                    </li>
                </ul>
            </div>

            <div class="user-card">
                <div class="user-info">
                    <div class="avatar" id="sidebar-user-avatar">U</div>
                    <div class="user-details">
                        <span class="user-name" id="sidebar-user-name">Usuario</span>
                        <span class="user-role" id="sidebar-user-role">Role</span>
                    </div>
                </div>
                <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-title">
                    <h2>Panel de Métricas</h2>
                </div>
            </header>

            <div class="content-scroll">
                <!-- Stats Row con los 5 indicadores desglosados individualmente -->
                <div class="stats-grid">
                    <div class="glass-card stat-card">
                        <div class="stat-icon total">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                        </div>
                        <div class="stat-info">
                            <h3 id="stat-total">-</h3>
                            <p>Total Tickets</p>
                        </div>
                    </div>

                    <div class="glass-card stat-card">
                        <div class="stat-icon opened">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
                        </div>
                        <div class="stat-info">
                            <h3 id="stat-opened">-</h3>
                            <p>Abiertos</p>
                        </div>
                    </div>

                    <div class="glass-card stat-card">
                        <div class="stat-icon assigned" style="color: #60a5fa;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><polyline points="16 11 18 13 22 9"></polyline></svg>
                        </div>
                        <div class="stat-info">
                            <h3 id="stat-assigned">-</h3>
                            <p>Asignados</p>
                        </div>
                    </div>

                    <div class="glass-card stat-card">
                        <div class="stat-icon in-process">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </div>
                        <div class="stat-info">
                            <h3 id="stat-in-process">-</h3>
                            <p>En Proceso</p>
                        </div>
                    </div>

                    <div class="glass-card stat-card">
                        <div class="stat-icon resolved">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                        <div class="stat-info">
                            <h3 id="stat-resolved">-</h3>
                            <p>Resueltos</p>
                        </div>
                    </div>

                    <div class="glass-card stat-card">
                        <div class="stat-icon closed" style="color: #94a3b8;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </div>
                        <div class="stat-info">
                            <h3 id="stat-closed">-</h3>
                            <p>Cerrados</p>
                        </div>
                    </div>
                </div>

                <!-- Priority Chart Section -->
                <div class="glass-card mt-3">
                    <h3 style="margin-bottom: 1rem; font-size: 1.1rem; font-weight: 600;">Incidencias por Estado</h3>
                    <div class="chart-container" id="states-chart">
                        <!-- Barras inyectadas por JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
