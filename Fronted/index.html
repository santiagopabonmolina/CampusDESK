<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusDESK - Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="purple-orb orb-1"></div>
    <div class="purple-orb orb-2"></div>
    
    <div class="auth-page">
        <div class="glass-card auth-container">
            <div class="auth-header">
                <div style="display: flex; justify-content: center; margin-bottom: 1rem;">
                    <div class="brand-icon" style="width: 48px; height: 48px; border-radius: 12px;">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                    </div>
                </div>
                <h1>CampusDESK</h1>
                <p class="text-muted">Gestión inteligente de incidencias y soporte técnico</p>
            </div>

            <div class="auth-tabs" id="auth-tabs-bar" role="tablist">
                <button type="button" class="auth-tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="login-form">Iniciar Sesión</button>
                <button type="button" class="auth-tab" id="tab-register" role="tab" aria-selected="false" aria-controls="register-form">Registrarse</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" role="tabpanel" aria-labelledby="tab-login">
                <div class="form-group">
                    <label class="form-label" for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-control" placeholder="nombre@campusdesk.com" required autocomplete="email">
                    <span class="form-error" id="login-email-error"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-password" id="btn-toggle-login-pwd" aria-label="Mostrar u ocultar contraseña">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>
                    <span class="form-error" id="login-password-error"></span>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.25rem;" id="btn-login">
                    Acceder a la Plataforma
                </button>
                <div id="login-general-error" class="form-error text-center" style="margin-top: 10px;"></div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="hidden" role="tabpanel" aria-labelledby="tab-register">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="reg-firstname">Nombre</label>
                        <input type="text" id="reg-firstname" class="form-control" placeholder="Juan" required autocomplete="given-name">
                        <span class="form-error" id="reg-firstname-error"></span>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-lastname">Apellido</label>
                        <input type="text" id="reg-lastname" class="form-control" placeholder="Pérez" required autocomplete="family-name">
                        <span class="form-error" id="reg-lastname-error"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="nombre@campusdesk.com" required autocomplete="email">
                    <span class="form-error" id="reg-email-error"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" id="btn-toggle-reg-pwd" aria-label="Mostrar u ocultar contraseña">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>
                    <!-- Indicador visual de fortaleza de contraseña -->
                    <div class="password-strength-container" id="strength-container" style="display: none;">
                        <div class="password-strength-track">
                            <div class="password-strength-bar" id="strength-bar"></div>
                        </div>
                        <span class="password-strength-text" id="strength-text">Seguridad de contraseña</span>
                    </div>
                    <span class="form-error" id="reg-password-error"></span>
                    <small class="text-muted" style="display:block; margin-top:4px; font-size:0.75rem;">Mínimo 6 caracteres</small>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.25rem;" id="btn-register">
                    Crear Cuenta
                </button>
                <div id="reg-general-error" class="form-error text-center" style="margin-top: 10px;"></div>
            </form>
        </div>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
