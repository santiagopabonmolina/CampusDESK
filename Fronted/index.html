<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusDESK - Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <script>
        function switchToLogin() {
            var tabL = document.getElementById('tab-login');
            var tabR = document.getElementById('tab-register');
            var formL = document.getElementById('login-form');
            var formR = document.getElementById('register-form');
            var bar = document.getElementById('auth-tabs-bar');
            if (tabL) tabL.className = 'auth-tab active';
            if (tabR) tabR.className = 'auth-tab';
            if (bar) bar.classList.remove('hidden');
            if (formL) formL.classList.remove('hidden');
            if (formR) formR.classList.add('hidden');
        }

        function switchToRegister() {
            var tabL = document.getElementById('tab-login');
            var tabR = document.getElementById('tab-register');
            var formL = document.getElementById('login-form');
            var formR = document.getElementById('register-form');
            var bar = document.getElementById('auth-tabs-bar');
            if (tabR) tabR.className = 'auth-tab active';
            if (tabL) tabL.className = 'auth-tab';
            if (bar) bar.classList.remove('hidden');
            if (formR) formR.classList.remove('hidden');
            if (formL) formL.classList.add('hidden');
        }
    </script>
</head>
<body>
    <div class="purple-orb orb-1"></div>
    <div class="purple-orb orb-2"></div>
    
    <div class="auth-page">
        <div class="glass-card auth-container">
            <a href="landing.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Volver a la presentación
            </a>

            <div class="auth-header">
                <div style="display: flex; justify-content: center; margin-bottom: 1rem;">
                    <div class="brand-icon" style="width: 48px; height: 48px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                    </div>
                </div>
                <h1>CampusDESK</h1>
                <p class="text-muted">Gestión de incidencias y soporte técnico</p>
            </div>

            <div class="auth-tabs" id="auth-tabs-bar">
                <button type="button" class="auth-tab active" id="tab-login" onclick="switchToLogin()">Iniciar Sesión</button>
                <button type="button" class="auth-tab" id="tab-register" onclick="switchToRegister()">Registrarse</button>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-control" placeholder="nombre@campusdesk.com" required>
                    <span class="form-error" id="login-email-error"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Contraseña</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                    <span class="form-error" id="login-password-error"></span>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="btn-login">
                    Acceder
                </button>
                <div id="login-general-error" class="form-error text-center" style="margin-top: 10px;"></div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="hidden">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="reg-firstname">Nombre</label>
                        <input type="text" id="reg-firstname" class="form-control" placeholder="Juan" required>
                        <span class="form-error" id="reg-firstname-error"></span>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-lastname">Apellido</label>
                        <input type="text" id="reg-lastname" class="form-control" placeholder="Pérez" required>
                        <span class="form-error" id="reg-lastname-error"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="nombre@campusdesk.com" required>
                    <span class="form-error" id="reg-email-error"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
                    <span class="form-error" id="reg-password-error"></span>
                    <small class="text-muted" style="display:block; margin-top:4px; font-size:0.75rem;">Mínimo 6 caracteres</small>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="btn-register">
                    Registrarse
                </button>
                <div id="reg-general-error" class="form-error text-center" style="margin-top: 10px;"></div>
            </form>
        </div>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
