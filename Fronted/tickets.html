<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusDESK - Tickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="purple-orb orb-1"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
                <div class="brand-text">CampusDESK</div>
            </div>

            <button class="btn-new-ticket" id="btn-open-create-modal">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nuevo Ticket
            </button>

            <div class="nav-section">
                <div class="nav-label">General</div>
                <ul class="nav-menu">
                    <li>
                        <a href="dashboard.html" class="nav-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="tickets.html" class="nav-item active">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            Tickets
                        </a>
                    </li>
                </ul>
            </div>

            <div class="nav-section admin-only hidden" id="admin-menu">
                <div class="nav-label">Administración</div>
                <ul class="nav-menu">
                    <li>
                        <a href="admin.html" class="nav-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            Gestión de Personal
                        </a>
                    </li>
                </ul>
            </div>

            <div class="user-card">
                <div class="user-info">
                    <div class="avatar" id="sidebar-user-avatar">U</div>
                    <div class="user-details">
                        <span class="user-name" id="sidebar-user-name">Usuario</span>
                        <span class="user-role" id="sidebar-user-role">Role</span>
                    </div>
                </div>
                <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-title">
                    <h2>Gestión de Tickets</h2>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="loadTickets()" style="padding: 8px; border-radius: 50%;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    </button>
                </div>
            </header>

            <div class="content-scroll">
                <div class="filters-bar">
                    <div style="flex: 1;">
                        <select id="filter-state" class="form-control" style="background: rgba(0,0,0,0.5);">
                            <option value="">Todos los Estados</option>
                            <option value="OPENED">Abierta</option>
                            <option value="ASSIGNED">Asignada</option>
                            <option value="IN_PROCESS">En Proceso</option>
                            <option value="RESOLVED">Resuelta</option>
                            <option value="CLOSED">Cerrada</option>
                        </select>
                    </div>
                </div>

                <div class="glass-card" style="padding: 0;">
                    <div class="tickets-table-container">
                        <table class="tickets-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Título</th>
                                    <th>Categoría</th>
                                    <th>Prioridad</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                </tr>
                            </thead>
                            <tbody id="tickets-tbody">
                                <!-- JS injected -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div id="loading-indicator" class="text-center" style="padding: 3rem;">
                        <span class="spinner" style="width: 30px; height: 30px;"></span>
                    </div>

                    <div id="empty-state" class="empty-state hidden">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                        <h3>No hay tickets</h3>
                        <p class="text-muted mt-2">No se encontraron solicitudes con los filtros actuales.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Nuevo Ticket -->
    <div class="modal-overlay" id="modal-create-ticket">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Nueva Solicitud</h3>
                <button class="btn-close" id="btn-close-create-modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <form id="form-create-ticket">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label" for="ticket-title">Título</label>
                        <input type="text" id="ticket-title" class="form-control" required placeholder="Ej: Falla en conexión VPN">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="ticket-category">Categoría</label>
                        <select id="ticket-category" class="form-control" required>
                            <option value="">Seleccione...</option>
                            <option value="HARDWARE">Hardware</option>
                            <option value="SOFTWARE">Software</option>
                            <option value="NETWORK">Redes</option>
                            <option value="ACCESS">Accesos</option>
                            <option value="OTHER">Otros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="ticket-priority">Prioridad</label>
                        <select id="ticket-priority" class="form-control" required>
                            <option value="">Seleccione...</option>
                            <option value="LOW">Baja</option>
                            <option value="MEDIUM">Media</option>
                            <option value="HIGH">Alta</option>
                            <option value="CRITIC">Crítica</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="ticket-desc">Descripción</label>
                        <textarea id="ticket-desc" class="form-control" rows="4" required placeholder="Detalle el problema..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-create">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-ticket">Crear Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { API } from './js/api.js';
        import { hasRole, CONFIG, getCurrentUser } from './js/auth.js';
        import { showToast, setupModal, formatDate, getStateBadge, getPriorityBadge, setButtonLoading, escapeHTML } from './js/ui.js';

        const { open: openCreate, close: closeCreate } = setupModal('modal-create-ticket', ['btn-open-create-modal'], ['btn-close-create-modal', 'btn-cancel-create']);

        // Check URL params for auto-open modal
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('action') === 'new') {
            openCreate();
        }

        if (hasRole(CONFIG.ROLES.ADMIN)) {
            document.getElementById('admin-menu').classList.remove('hidden');
        }

        // Filters
        const filterState = document.getElementById('filter-state');
        filterState.addEventListener('change', loadTickets);

        // Load Tickets
        async function loadTickets() {
            const tbody = document.getElementById('tickets-tbody');
            const loading = document.getElementById('loading-indicator');
            const empty = document.getElementById('empty-state');
            const stateValue = filterState.value;

            tbody.innerHTML = '';
            empty.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                const tickets = await API.getTickets(stateValue || null);
                
                if (tickets.length === 0) {
                    empty.classList.remove('hidden');
                } else {
                    // Sort by id desc (newest first)
                    tickets.sort((a, b) => b.id - a.id);
                    
                    tickets.forEach(ticket => {
                        const tr = document.createElement('tr');
                        tr.onclick = () => window.location.href = `ticket-detail.html?id=${ticket.id}`;
                        
                        // Categories translation mapping
                        const catLabels = { 'HARDWARE':'Hardware', 'SOFTWARE':'Software', 'NETWORK':'Redes', 'ACCESS':'Accesos', 'OTHER':'Otros' };
                        
                        tr.innerHTML = `
                            <td style="font-weight: 500;">#${ticket.id}</td>
                            <td>
                                <div>${escapeHTML(ticket.title)}</div>
                                <small class="text-muted">${escapeHTML(ticket.requesterName)}</small>
                            </td>
                            <td>${catLabels[ticket.category] || ticket.category}</td>
                            <td>${getPriorityBadge(ticket.priority)}</td>
                            <td>${getStateBadge(ticket.state)}</td>
                            <td>${formatDate(ticket.createDate)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Create Ticket
        document.getElementById('form-create-ticket').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-ticket');
            const user = getCurrentUser();

            const data = {
                title: document.getElementById('ticket-title').value,
                description: document.getElementById('ticket-desc').value,
                category: document.getElementById('ticket-category').value,
                priority: document.getElementById('ticket-priority').value,
                requesterId: user.id
            };

            try {
                setButtonLoading(btn, true, 'Crear Ticket');
                await API.createTicket(data);
                showToast('Ticket creado exitosamente', 'success');
                closeCreate();
                document.getElementById('form-create-ticket').reset();
                loadTickets();
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                setButtonLoading(btn, false, 'Crear Ticket');
            }
        });

        // Init
        document.addEventListener('DOMContentLoaded', loadTickets);
    </script>
</body>
</html>
