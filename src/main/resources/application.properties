spring.application.name=spring

# Configuración de conexión a PostgreSQL (Variables de entorno con fallback para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5438/campusDESK}
spring.datasource.username=${DB_USERNAME:dev_user}
spring.datasource.password=${DB_PASSWORD:DevTeamSecurePass2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT - Clave secreta y tiempo de expiración parametrizados por entorno
jwt.secret=${JWT_SECRET:campusDeskSecretKey2026SuperSecureRandomStringAtLeast256BitsLong!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - Incluye puertos locales habituales (Live Server 5500/5501, IntelliJ IDEA 63342, Python 8000/5500)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5501,http://localhost:5501,http://localhost:63342,http://127.0.0.1:63342}

# Configuración opcional de correo electrónico (SMTP Gmail, Outlook, etc.)
# Si no se definen variables de entorno, EmailService opera en modo simulación registrando el código en consola
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Server port
server.port=${SERVER_PORT:8080}

# Swagger / OpenAPI (Springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.path=/v3/api-docs
