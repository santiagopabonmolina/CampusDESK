spring.application.name=spring

# Perfil activo por defecto
spring.profiles.active=dev

# Configuración de conexión a PostgreSQL (Docker Compose)
spring.datasource.url=jdbc:postgresql://localhost:5438/campusDESK
spring.datasource.username=dev_user
spring.datasource.password=DevTeamSecurePass2026!
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Correo SMTP (Variables de entorno con fallback vacío en dev)
spring.mail.host=${SPRING_MAIL_HOST:${SMTP_HOST:}}
spring.mail.port=${SPRING_MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT
jwt.secret=campusDeskSecretKey2026SuperSecureRandomStringAtLeast256BitsLong!!
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5501,http://localhost:5501

# Server port
server.port=8080
