# Configures the logical application name identifier for Spring Boot context
spring.application.name=spring

# Configuración de conexión a PostgreSQL (Variables de entorno con fallback para desarrollo local)
# Specifies PostgreSQL JDBC database connection URL with environment variable override
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5438/campusDESK}
# Sets database username for authentication with development fallback default
spring.datasource.username=${DB_USERNAME:dev_user}
# Sets database password credentials with environment variable fallback value
spring.datasource.password=${DB_PASSWORD:DevTeamSecurePass2026!}
# Configures fully qualified class name of PostgreSQL JDBC driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# Configures Hibernate schema update mode altering database tables on startup
spring.jpa.hibernate.ddl-auto=update
# Enables printing generated SQL statements to standard console output
spring.jpa.show-sql=true
# Formats generated SQL queries with indentation for readable console debugging
spring.jpa.properties.hibernate.format_sql=true
# Configures Hibernate dialect matching PostgreSQL features and data types
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT - Clave secreta y tiempo de expiración parametrizados por entorno
# Injects secret cryptographic signing key for HMAC-SHA256 token verification
jwt.secret=${JWT_SECRET:campusDeskSecretKey2026SuperSecureRandomStringAtLeast256BitsLong!!}
# Configures token lifespan duration in milliseconds representing twenty-four hours
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - Solo los orígenes autorizados del frontend (sin comodín * general)
# Defines comma-separated list of allowed origin hosts for CORS filtering
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5501,http://localhost:5501,http://localhost:63342,http://127.0.0.1:63342,http://localhost:8050,http://127.0.0.1:8050,http://localhost:8080,http://127.0.0.1:8080}

# Server port unificado en 8050
# Configures embedded Tomcat HTTP server listening port to 8050
server.port=${SERVER_PORT:8050}

# Swagger / OpenAPI (Springdoc)
# Configures customized URL endpoint path serving interactive Swagger UI HTML
springdoc.swagger-ui.path=/swagger-ui.html
# Sorts API endpoints alphabetically within each tag controller section
springdoc.swagger-ui.operationsSorter=alpha
# Sorts tag controller sections alphabetically in Swagger UI documentation
springdoc.swagger-ui.tagsSorter=alpha
# Enables interactive Try It Out button by default in Swagger
springdoc.swagger-ui.tryItOutEnabled=true
# Configures endpoint path serving raw OpenAPI specification in JSON format
springdoc.api-docs.path=/v3/api-docs
